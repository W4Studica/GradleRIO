// WPILib for Studica: a C++ robot program for a VMX-pi, cross compiled on this PC and deployed with ./gradlew deploy.
// See README.md for the steps. Everything that is specific to the robot is in the first block.

plugins {
    id "cpp"
    id "org.wpilib.GradleRIO"
}

// ---- the robot ----------------------------------------------------------------------------------------------------
// Connect as ubuntu/password. The WPILib team number selects the VMX Wi-Fi address; GradleRIO also tries its wired address.
// The allwpilib fork with halsim_studica and studica_drivers; the default is the folder next to GradleRIO.
def allwpilib = file(findProperty('allwpilibDir') ?: '../../../allwpilib')
def halsimStudica = new File(allwpilib, 'simulation/halsim_studica')
def studicaRoot = new File(allwpilib, 'studica')
def studicaDriversDir = new File(studicaRoot, 'drivers')
def libDir = "/home/ubuntu/wpilib/third-party/lib"   // where deploy puts the libraries

deploy {
    targets {
        vmx(getTargetTypeClass('VmxPi')) {
            team = wpilib.getTeamNumber()

            artifacts {
                wpilibCpp(getArtifactTypeClass('WPILibNativeArtifact')) {
                    // halsimExtensions defaults to <library dir>/libhalsim_studica.so, which is built and deployed below.
                    environment.put('HALSIMSTUDICA_BACKEND', libDir + '/libstudica_hardware.so')
                    // The kernel of the VMX image has no /sys/class/gpio; this makes the HAL's GPIO interrupts work.
                    // Installed on the robot by Robot-Manager's install.sh.
                    environment.put('LD_PRELOAD', '/opt/robot_manager/lib/libvmx_gpio_isr_shim.so')

                    // WPILib channel -> VMX channel.
                    environment.put('HALSIMSTUDICA_DIO_MAP', '0:0,1:1')     // DigitalInput/Output/Encoder 0 and 1
                    environment.put('HALSIMSTUDICA_ANALOG_MAP', '0:22')     // AnalogInput 0 -> AnalogIn 22
                    environment.put('HALSIMSTUDICA_IMU', '1')               // OnboardIMU from the navX

                    // Read by src/main/cpp/main.cpp. Leave TITAN_ID out if there is no Titan.
                    environment.put('TITAN_ID', '42')
                    environment.put('TITAN_MOTOR', '0')
                    environment.put('TITAN_SPEED', '0')                 // 0..1; keep 0 until the wheels are off the ground
                }
            }
        }
    }
}

// ---- what only the robot has: VMXPi.h and libvmxpi_hal_cpp.so (fetched by deploy) ------------------------
def vmxHeaders = deploy.targets.vmx.sdkPath('/usr/local/include/vmxpi')
def vmxHal = deploy.targets.vmx.sdkPath('/usr/local/lib/vmxpi/libvmxpi_hal_cpp.so')
def robotLink = ['-Wl,-rpath,/usr/local/lib/vmxpi', '-Wl,-rpath-link,' + vmxHal.parent, '-Wl,--allow-shlib-undefined']

def deployArtifact = deploy.targets.vmx.artifacts.wpilibCpp

model {
    components {
        studica(NativeLibrarySpec) {
            targetPlatform wpi.platforms.linuxarm64
            sources.cpp {
                source {
                    srcDir new File(studicaRoot, 'src')
                    exclude 'StudicaBackend.cpp', 'Titan.cpp'
                }
                exportedHeaders { srcDir new File(studicaRoot, 'include') }
            }
            binaries.all { linker.args '-ldl', '-lpthread' }
        }

        // The HAL extension that connects WPILib's DIO/Analog/Encoder/IMU to the VMX. No VMX headers needed.
        halsim_studica(NativeLibrarySpec) {
            targetPlatform wpi.platforms.linuxarm64
            sources.cpp {
                source { srcDir new File(halsimStudica, 'src/main/native/cpp') }
                exportedHeaders { srcDir new File(halsimStudica, 'src/main/native/include') }
            }
            binaries.all { lib library: 'studica', linkage: 'shared' }
            wpi.cpp.deps.useLibrary(it, 'hal_shared', 'wpiutil_shared')
        }

        // The Studica backend plugin for halsim_studica (the Studica drivers, unmodified).
        studica_hardware(NativeLibrarySpec) {
            targetPlatform wpi.platforms.linuxarm64
            sources {
                cpp {
                    source {
                        srcDir new File(studicaRoot, 'src')
                        include 'StudicaBackend.cpp', 'DeviceConversions.cpp', 'Titan.cpp'
                    }
                    exportedHeaders {
                        srcDir new File(studicaRoot, 'include')
                    }
                }
                studicaDrivers(CppSourceSet) {
                    source {
                        srcDir studicaDriversDir
                        include 'analog_input.cpp', 'dio.cpp', 'encoder.cpp', 'imu.cpp', 'titan.cpp'
                    }
                }
            }
            binaries.all {
                cppCompiler.args '-I' + vmxHeaders.path, '-I' + studicaDriversDir.path,
                                 '-I' + new File(allwpilib, 'hal/src/main/native/include').path,
                                 '-I' + new File(allwpilib, 'wpiutil/src/main/native/include').path
                linker.args(*([vmxHal.path] + robotLink))
            }
        }

        // The robot program.
        robot(NativeExecutableSpec) {
            targetPlatform wpi.platforms.linuxarm64

            sources.cpp {
                source { srcDir 'src/main/cpp' }
            }
            binaries.all {
                // SharedVMX() has to be the VMXPi that halsim_studica uses (two VMXPi in one process break the SPI link),
                // so the program links the very same plugin library.
                lib library: 'studica_hardware', linkage: 'shared'
                lib library: 'studica', linkage: 'shared'
                // Linking the extension too makes deploy upload it; the HAL loads it by path (HALSIM_EXTENSIONS).
                lib library: 'halsim_studica', linkage: 'shared'
                cppCompiler.args '-I' + vmxHeaders.path, '-I' + studicaDriversDir.path,
                                 '-I' + new File(halsimStudica, 'src/main/native/include').path,
                                 '-I' + new File(studicaRoot, 'include').path
                linker.args(*([vmxHal.path] + robotLink))
            }

            deployArtifact.component = it
            wpi.cpp.enableExternalTasks(it)
            wpi.cpp.deps.wpilib(it)
        }
    }
}
